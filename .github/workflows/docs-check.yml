name: Docs consistency

# The Related table in README.md is generated from catalog.yaml in
# morsalin1342/docker-images. This job fails when the README disagrees with that
# version of the catalog. The action is pinned by commit SHA, so the catalog
# changes here only through a reviewed pull request (Dependabot opens one for
# each new release).

on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    if: github.repository == 'morsalin1342/caddy-souin-cache-manager'
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check consistency with the catalog
        uses: morsalin1342/docker-images@ea7b2da045d2bdd92b79e4af8c4c775fb641ae14 # v1.3.0
